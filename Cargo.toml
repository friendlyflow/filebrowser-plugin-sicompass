# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "filebrowser-plugin"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "File browser for sicompass: the filesystem as a list of lists, as a plugin"
repository = "https://github.com/friendlyflow/filebrowser-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The file browser itself is the
# library, which the unit tests use.
[[bin]]
name = "filebrowser-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
# Natural sort order ("file2" before "file10").
natord = "1"
# A delete's snapshot travels in an undo payload, which is FFON text.
base64 = "0.22"

# The properties view's owner and group names and the local UTC offset. On
# Windows there are none, and it shows size and date only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
