# Its own workspace root: a plugin, only ever built for wasm32-wasip2 (and
# natively for its unit tests).
[workspace]

[package]
name = "filebrowser-plugin"
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
description = "File browser for sicompass: the filesystem as a list of lists, as a WASM plugin"
repository = "https://github.com/friendlyflow/filebrowser_plugin_sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest kit and the FFON model, from crates.io.
sicompass-pdk = "0.6.0"
sicompass-sdk = { version = "0.9.0", default-features = false }
# Natural sort order ("file2" before "file10").
natord = "1"
# A delete's snapshot travels in an undo payload, which is FFON text.
base64 = "0.22"

# The properties view's permission bits and owner names, in native test builds.
# Inside the sandbox there are none, and it shows size and date only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Guests ship as bytecode, and App Store builds interpret rather than JIT them, so
# a small module matters more than aggressive inlining.
opt-level = "s"
lto = true
strip = true

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# [patch.crates-io]
# sicompass-pdk = { path = "../sicompass-plugin-sdk/sicompass-pdk" }
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
